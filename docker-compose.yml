services:
  db:
    image: postgres:16-alpine
    container_name: quilt-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: quilt
      POSTGRES_PASSWORD: quilt
      POSTGRES_DB: quilt
    ports:
      - "5432:5432"
    volumes:
      - quilt_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quilt"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  quilt_db_data:
