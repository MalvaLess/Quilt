<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ isRojo }}" hint-placeholder-val="{{ true }}">
  <div onclick="{{ onClick }}" style="display:flex;align-items:center;justify-content:center;gap:6px;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:14px;color:#ffb3c0;background:rgba(255,45,79,0.16);border:1.5px solid #ff2d4f;border-radius:10px;padding:13px 20px;box-shadow:0 0 18px rgba(255,45,79,0.3);cursor:pointer;width:100%;transition:transform 0.15s ease;" style-hover="transform:scale(1.02);">{{ label }}</div>
</sc-if>
<sc-if value="{{ isVerde }}" hint-placeholder-val="{{ false }}">
  <div onclick="{{ onClick }}" style="display:flex;align-items:center;justify-content:center;gap:6px;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:14px;color:#a8f0c6;background:rgba(46,204,113,0.16);border:1.5px solid #2ecc71;border-radius:10px;padding:13px 20px;box-shadow:0 0 18px rgba(46,204,113,0.3);cursor:pointer;width:100%;transition:transform 0.15s ease;" style-hover="transform:scale(1.02);">{{ label }}</div>
</sc-if>
<sc-if value="{{ isAzul }}" hint-placeholder-val="{{ false }}">
  <div onclick="{{ onClick }}" style="display:flex;align-items:center;justify-content:center;gap:6px;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:14px;color:#b8dcff;background:rgba(79,157,255,0.16);border:1.5px solid #4f9dff;border-radius:10px;padding:13px 20px;box-shadow:0 0 18px rgba(79,157,255,0.3);cursor:pointer;width:100%;transition:transform 0.15s ease;" style-hover="transform:scale(1.02);">{{ label }}</div>
</sc-if>
<sc-if value="{{ isDorado }}" hint-placeholder-val="{{ false }}">
  <div onclick="{{ onClick }}" style="display:flex;align-items:center;justify-content:center;gap:6px;font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:14px;color:#ffe3a8;background:rgba(232,177,58,0.16);border:1.5px solid #e8b13a;border-radius:10px;padding:13px 20px;box-shadow:0 0 18px rgba(232,177,58,0.3);cursor:pointer;width:100%;transition:transform 0.15s ease;" style-hover="transform:scale(1.02);">{{ label }}</div>
</sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:48},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Continuar&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;rojo&quot;,&quot;options&quot;:[&quot;rojo&quot;,&quot;verde&quot;,&quot;azul&quot;,&quot;dorado&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;onClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? "rojo";
    return {
      label: this.props.label ?? "Continuar",
      onClick: this.props.onClick ?? (() => {}),
      isRojo: theme === "rojo",
      isVerde: theme === "verde",
      isAzul: theme === "azul",
      isDorado: theme === "dorado"
    };
  }
}

</script>
</body>
</html>
